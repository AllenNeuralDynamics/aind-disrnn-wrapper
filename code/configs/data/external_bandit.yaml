# Canonical external binary two-arm-bandit data with an explicit subject/session split.
_target_: data_loaders.external_bandit.ExternalBanditDatasetLoader

file_path: /path/to/canonical_trials.parquet
split_manifest_path: /path/to/session_split.json
dataset_id: null               # optional; checked against manifest/table when present
species: null                  # optional; checked against manifest/table when present
subject_ids: null              # null -> require every table subject in the manifest
features: null                 # null -> previous choice + previous reward
batch_size: 1024
batch_mode: random             # single | rolling | random
# Schema v1: first K sessions in each subject's manifest adaptation list.
# K=0 is GRU zero-shot; it is not a fitted subject-level Q-learning condition.
adapt_sessions_per_subject: null
seed: ${seed}
